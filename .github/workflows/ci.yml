name: Verify SmartCompare
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartcompare
          POSTGRES_USER: smartcompare
          POSTGRES_PASSWORD: smartcompare
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U smartcompare"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://smartcompare:smartcompare@localhost:5432/smartcompare
      REDIS_URL: redis://localhost:6379
      ALLOW_DEGRADED_MODE: 'false'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      CORS_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @smartcompare/api start > /tmp/smartcompare-api.log 2>&1 &
      - run: pnpm test:e2e
